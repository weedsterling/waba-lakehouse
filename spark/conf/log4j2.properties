# Journalisation Spark : WARN par défaut, bruits connus et sans impact réduits au silence.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Iceberg 1.6 : « Unclosed S3FileIO instance » + pile d'appels complète à chaque lecture de table par
# le catalogue REST (les clients sont fermés par le ramasse-miettes) -> sans impact, très verbeux.
logger.s3fileio.name = org.apache.iceberg.aws.s3.S3FileIO
logger.s3fileio.level = error
# Bruits de démarrage sans conséquence
logger.metrics.name = org.apache.hadoop.metrics2
logger.metrics.level = error
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
logger.kafkaadmin.name = org.apache.kafka.clients.admin.AdminClientConfig
logger.kafkaadmin.level = error
logger.kafkaconsumer.name = org.apache.kafka.clients.consumer.ConsumerConfig
logger.kafkaconsumer.level = error
