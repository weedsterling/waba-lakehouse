# =============================================================================
# WABA Group — Level 4 : déploiement Kubernetes de toute la plateforme en UNE commande
#   ./scripts/k8s/deploy.sh      (cluster + images + secrets + helmfile sync)
# Un release Helm par composant, chacun dans le namespace de son domaine :
#   ingestion (MinIO, NiFi, Kafka) · processing (Iceberg, Spark, Airflow) · serving (Trino, Superset)
#   governance (Keycloak, OpenMetadata) · monitoring (Prometheus, Grafana, Loki)
# Aucun secret dans ce dépôt : les Secrets Kubernetes sont créés depuis .env par bootstrap.sh.
# =============================================================================
repositories:
  - name: strimzi
    url: https://strimzi.io/charts/
  - name: spark-operator
    url: https://kubeflow.github.io/spark-operator

helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 900
  createNamespace: false        # namespaces créés (et étiquetés) par bootstrap.sh

releases:
  # ------------------------------------------------------------ 9.1 : socle stockage + catalogue
  - name: minio
    namespace: ingestion
    chart: ./charts/minio

  - name: iceberg-rest
    namespace: processing
    chart: ./charts/iceberg-rest
    needs: [ingestion/minio]

  # ------------------------------------------------------------ 9.2 : ingestion temps réel + serving
  - name: strimzi
    namespace: ingestion
    chart: strimzi/strimzi-kafka-operator
    version: 0.45.0                   # opérateur Kafka (CRD Kafka, KafkaNodePool, KafkaTopic)
    values:
      # Marge mémoire/CPU et sondes tolérantes au démarrage de la JVM sur Minikube.
      # NB : Strimzi 0.45 exige Kubernetes <= 1.32 (cf. scripts/k8s/cluster-up.sh, K8S_VERSION).
      - resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 1Gi } }
        livenessProbe: { initialDelaySeconds: 90, periodSeconds: 30 }
        readinessProbe: { initialDelaySeconds: 60, periodSeconds: 30 }

  - name: kafka
    namespace: ingestion
    chart: ./charts/kafka
    needs: [ingestion/strimzi]

  - name: nifi
    namespace: ingestion
    chart: ./charts/nifi
    needs: [ingestion/minio, ingestion/kafka]
    timeout: 1800                     # premier démarrage de NiFi + Job de provisionnement du flux

  - name: generator
    namespace: ingestion
    chart: ./charts/generator
    needs: [ingestion/minio]

  - name: trino
    namespace: serving
    chart: ./charts/trino
    needs: [processing/iceberg-rest, ingestion/kafka, governance/keycloak]

  # ------------------------------------------------------------ 9.3 : traitements Spark sur Kubernetes
  - name: spark-operator
    namespace: processing
    chart: spark-operator/spark-operator
    version: 2.1.1                    # opérateur kubeflow (CRD SparkApplication), Spark 3.5
    values:
      - spark:
          jobNamespaces: [processing] # seul namespace où les SparkApplication sont autorisées
          serviceAccount: { create: true, name: waba-spark }
        controller:
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
        webhook:
          enable: true                # requis : volumes, variables d'environnement et secrets des pods Spark
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }

  - name: spark-jobs
    namespace: processing
    chart: ./charts/spark-jobs
    needs: [processing/spark-operator, processing/iceberg-rest, ingestion/kafka]

  # ------------------------------------------------------------ 9.4 : orchestration
  - name: airflow
    namespace: processing
    chart: ./charts/airflow
    needs: [processing/spark-jobs]    # modèle des jobs batch (ConfigMap spark-batch-template)
    timeout: 1200                     # migration initiale du schéma + démarrage des 3 composants

  # ------------------------------------------------------------ 9.5 : visualisation
  - name: superset
    namespace: serving
    chart: ./charts/superset
    needs: [serving/trino, governance/keycloak]
    timeout: 1200                     # migration du schéma + import des tableaux de bord

  # ------------------------------------------------------------ 9.6 : gouvernance & sécurité
  - name: keycloak
    namespace: governance
    chart: ./charts/keycloak
    timeout: 900                      # premier démarrage : optimisation Quarkus + import du realm

  - name: openmetadata
    namespace: governance
    chart: ./charts/openmetadata
    needs: [serving/trino]
    timeout: 900                      # installé arrêté (replicas 0) : scripts/k8s/governance.sh up
