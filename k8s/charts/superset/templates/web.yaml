# Serveur web Superset (gunicorn). Attend que le Job d'init ait migré le schéma.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  labels: { app.kubernetes.io/name: superset, app.kubernetes.io/part-of: waba }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: superset }
  template:
    metadata:
      labels: { app.kubernetes.io/name: superset, app.kubernetes.io/part-of: waba }
      annotations:
        waba.io/config-checksum: {{ include "superset.checksum" . | quote }}
    spec:
      automountServiceAccountToken: false
      # Sans cela, Kubernetes injecte SUPERSET_PORT=tcp://<ip>:8088 (variables du Service « superset »),
      # que run-server.sh passe à gunicorn comme port -> « 'tcp' is not a valid port number ».
      enableServiceLinks: false
      initContainers:
        - name: wait-for-schema           # tables créées par `superset db upgrade` (Job d'init)
          image: {{ .Values.db.image }}
          command: ["sh", "-c", "until psql -h superset-postgres -U superset -d superset -tAc 'SELECT 1 FROM ab_user LIMIT 1' >/dev/null 2>&1; do echo attente du schema; sleep 5; done"]
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: waba-superset, key: SUPERSET_DB_PASSWORD } }
      containers:
        - name: superset
          image: {{ .Values.image }}
          imagePullPolicy: Never
          env:
            {{- include "superset.env" . | nindent 12 }}
            - { name: SUPERSET_PORT, value: "8088" }
            - { name: SERVER_WORKER_AMOUNT, value: {{ .Values.web.workers | quote }} }
            - { name: SERVER_THREADS_AMOUNT, value: {{ .Values.web.threads | quote }} }
            - { name: GUNICORN_TIMEOUT, value: "120" }
          ports:
            - { name: http, containerPort: 8088 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            {{- include "superset.mounts" . | nindent 12 }}
      volumes:
        {{- include "superset.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: superset
spec:
  selector: { app.kubernetes.io/name: superset }
  ports:
    - { name: http, port: 8088, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superset
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superset
                port: { name: http }
