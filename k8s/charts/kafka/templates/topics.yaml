# Topics déclarés comme ressources Kubernetes : versionnés, recréés à l'identique (remplace kafka-init.sh)
{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .name }}
  labels: { strimzi.io/cluster: waba }
spec:
  partitions: 8
  replicas: 1
  config:
    retention.ms: {{ .retentionMs }}
    cleanup.policy: delete
{{- end }}
