# Kafka en mode KRaft (sans ZooKeeper) : un nœud contrôleur + broker, volume persistant.
# Bootstrap interne : {{ .Values.cluster }}-kafka-bootstrap.{{ .Release.Namespace }}.svc:9092
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  labels: { strimzi.io/cluster: {{ .Values.cluster }} }
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - { id: 0, type: persistent-claim, size: {{ .Values.storage }}, deleteClaim: false, kraftMetadata: shared }
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 1536Mi }
  jvmOptions: { "-Xms": 512m, "-Xmx": 768m }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Values.cluster }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Values.version }}
    metadataVersion: {{ .Values.metadataVersion }}
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
  entityOperator:
    topicOperator:
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { memory: 384Mi }
