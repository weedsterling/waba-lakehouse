# Compte PostgreSQL en lecture seule pour Grafana (9.7) : alerte « dag_regulatory_report en échec à 06h00 UTC ».
# Moindre privilège : SELECT sur la seule table dag_run, session en lecture seule, 5 connexions max, requêtes
# coupées à 5 s. Idempotent (rejoué à chaque révision Helm) ; mot de passe lu dans le Secret waba-airflow.
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-grafana-reader-{{ .Release.Revision }}
  labels: { app.kubernetes.io/name: airflow-grafana-reader, app.kubernetes.io/part-of: waba }
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: airflow-grafana-reader, app.kubernetes.io/part-of: waba }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: grant
          image: {{ .Values.db.image }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export PGHOST=airflow-postgres PGUSER=airflow PGDATABASE=airflow
              # la table dag_run est créée par la migration du Job airflow-init
              until psql -tAc "SELECT to_regclass('public.dag_run')" 2>/dev/null | grep -q dag_run; do
                echo "attente de la migration Airflow"; sleep 5
              done
              psql -v ON_ERROR_STOP=1 -v pw="$GRAFANA_DB_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE grafana_ro LOGIN'
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'grafana_ro')\gexec
              ALTER ROLE grafana_ro WITH LOGIN PASSWORD :'pw' CONNECTION LIMIT 5;
              ALTER ROLE grafana_ro SET default_transaction_read_only = on;
              ALTER ROLE grafana_ro SET statement_timeout = '5s';
              REVOKE ALL ON ALL TABLES IN SCHEMA public FROM grafana_ro;
              GRANT CONNECT ON DATABASE airflow TO grafana_ro;
              GRANT USAGE ON SCHEMA public TO grafana_ro;
              GRANT SELECT ON public.dag_run TO grafana_ro;
              SQL
              echo "compte grafana_ro prêt (SELECT sur dag_run)"
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: waba-airflow, key: AIRFLOW_DB_PASSWORD } }
            - name: GRAFANA_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: waba-airflow, key: AIRFLOW_GRAFANA_DB_PASSWORD } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
