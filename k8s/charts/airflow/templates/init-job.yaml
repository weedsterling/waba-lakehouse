# Migration du schéma + pool « spark » (1 job Spark batch à la fois). Un Job par révision Helm :
# chaque `helmfile sync` rejoue la migration (idempotente) après une montée de version d'Airflow.
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init-{{ .Release.Revision }}
  labels: { app.kubernetes.io/name: airflow-init, app.kubernetes.io/part-of: waba }
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: airflow-init, app.kubernetes.io/part-of: waba }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: {{ .Values.db.image }}
          command: ["sh", "-c", "until pg_isready -h airflow-postgres -U airflow; do sleep 3; done"]
      containers:
        - name: init
          image: {{ .Values.image }}
          imagePullPolicy: Never
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              airflow db migrate
              airflow pools set spark 1 "Un seul job Spark batch a la fois"
              echo "Airflow initialisé"
          env:
            {{- include "airflow.env" . | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
