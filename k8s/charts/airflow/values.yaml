# Image Airflow des Levels 2-3 (providers amazon + apache-spark épinglés), chargée depuis la VM.
image: waba/airflow:3.3.2-spark3.5.3
host: airflow.waba.local

# Mêmes réglages que Docker Compose ; seuls changent les adresses (services Kubernetes) et le mode Spark.
config:
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "8"               # tâches simultanées max (chaque tâche = 1 processus Python)
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin   # SSO Keycloak à l'étape 9.6
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
  AIRFLOW__API__WORKERS: "1"                    # 1 worker uvicorn : ~4x moins de mémoire que le défaut
  AIRFLOW__API__BASE_URL: http://airflow.waba.local
  AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  WABA_SPARK_MODE: kubernetes                   # spark_job() -> SparkApplication (waba/spark_k8s.py)
  WABA_SPARK_TEMPLATE: /opt/waba/k8s/sparkapplication.yaml
  WABA_SPARK_NAMESPACE: processing

s3Endpoint: http://minio.ingestion.svc.cluster.local:9000
region: us-east-1

db:
  image: postgres:16-alpine
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

logsStorage: 2Gi                                # journaux des tâches (StatefulSet scheduler)
initImage: busybox:1.36

# Réservations (requests) modestes : la mémoire du nœud va d'abord aux pods Spark (flux + 1 job batch).
resources:
  apiServer:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1536Mi }
  scheduler:                                    # exécute aussi les tâches (LocalExecutor)
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 3Gi }
  dagProcessor:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  triggerer:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 768Mi }
