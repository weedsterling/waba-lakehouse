# MinIO mono-nœud : StatefulSet + volume persistant (les données survivent aux redémarrages du pod).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: waba }
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: minio }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: waba }
    spec:
      containers:
        - name: minio
          image: {{ .Values.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef: { name: waba-minio-root }     # créé par scripts/k8s/bootstrap.sh depuis .env
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          livenessProbe:
            httpGet: { path: /minio/health/live, port: api }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            periodSeconds: 10
          resources:
            requests: { cpu: {{ .Values.resources.requests.cpu }}, memory: {{ .Values.resources.requests.memory }} }
            limits: { memory: {{ .Values.resources.limits.memory }} }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: {{ .Values.storage }} }
