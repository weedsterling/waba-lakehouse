# Catalogue as code (openmetadata/catalog.py) : découverte Trino, documentation Gold, PII, lineage.
# Suspendu par défaut (OpenMetadata démarré à la demande) ; `governance.sh up` le réactive (passage
# quotidien), `governance.sh catalog` le lance immédiatement.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openmetadata-catalog
  labels: { app.kubernetes.io/name: openmetadata-catalog, app.kubernetes.io/part-of: waba }
spec:
  schedule: {{ .Values.catalog.schedule | quote }}
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app.kubernetes.io/name: openmetadata-catalog, app.kubernetes.io/part-of: waba }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          containers:
            - name: catalog
              image: {{ .Values.catalogImage }}
              imagePullPolicy: Never
              command: ["python", "-u", "/catalog/catalog.py"]
              env:
                - { name: OM_URL, value: "http://openmetadata:8585" }
                - name: OM_ADMIN_PASSWORD
                  valueFrom: { secretKeyRef: { name: waba-openmetadata, key: OM_ADMIN_PASSWORD } }
                - { name: TRINO_HOSTPORT, value: {{ .Values.catalog.trinoHostPort | quote }} }
              resources:
                requests: { cpu: 100m, memory: 512Mi }
                limits: { memory: 1536Mi }
              volumeMounts:
                - { name: code, mountPath: /catalog, readOnly: true }
          volumes:
            - name: code
              configMap: { name: openmetadata-catalog }
