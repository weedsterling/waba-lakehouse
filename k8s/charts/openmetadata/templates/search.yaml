# Moteur de recherche OpenMetadata (Elasticsearch mono-nœud, interne au namespace, sans exposition).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openmetadata-search
  labels: { app.kubernetes.io/name: openmetadata-search, app.kubernetes.io/part-of: waba }
spec:
  serviceName: openmetadata-search
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: openmetadata-search }
  template:
    metadata:
      labels: { app.kubernetes.io/name: openmetadata-search, app.kubernetes.io/part-of: waba }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { fsGroup: 1000 }
      initContainers:
        - name: max-map-count               # exigence Elasticsearch (mmap), réglage du nœud Minikube
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
          securityContext: { privileged: true, runAsUser: 0 }
      containers:
        - name: elasticsearch
          image: {{ .Values.search.image }}
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }   # interne au cluster (Service ClusterIP)
            # Mono-nœud de démo : pas de passage des index en lecture seule si le disque du nœud dépasse 85-95 %
            - { name: cluster.routing.allocation.disk.threshold_enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: {{ .Values.search.heap | quote }} }
          ports:
            - { name: http, containerPort: 9200 }
          readinessProbe:
            httpGet: { path: "/_cluster/health?local=true", port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            {{- toYaml .Values.search.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.search.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata-search
spec:
  selector: { app.kubernetes.io/name: openmetadata-search }
  ports:
    - { name: http, port: 9200, targetPort: http }
