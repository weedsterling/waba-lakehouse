apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  labels: { app.kubernetes.io/name: iceberg-rest, app.kubernetes.io/part-of: waba }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: iceberg-rest }
  template:
    metadata:
      labels: { app.kubernetes.io/name: iceberg-rest, app.kubernetes.io/part-of: waba }
    spec:
      initContainers:
        - name: wait-for-db               # le catalogue initialise son schéma JDBC au démarrage
          image: {{ .Values.db.image }}
          command: ["sh", "-c", "until pg_isready -h iceberg-catalog-db -U {{ .Values.db.user }}; do sleep 3; done"]
      containers:
        - name: iceberg-rest
          image: {{ .Values.image }}
          env:
            - { name: CATALOG_WAREHOUSE, value: "{{ .Values.warehouse }}" }
            - { name: CATALOG_IO__IMPL, value: org.apache.iceberg.aws.s3.S3FileIO }
            - { name: CATALOG_S3_ENDPOINT, value: "{{ .Values.s3Endpoint }}" }
            - { name: CATALOG_S3_PATH__STYLE__ACCESS, value: "true" }
            - { name: CATALOG_URI, value: "jdbc:postgresql://iceberg-catalog-db:5432/{{ .Values.db.name }}" }
            - { name: CATALOG_JDBC_USER, value: {{ .Values.db.user | quote }} }
            - name: CATALOG_JDBC_PASSWORD
              valueFrom: { secretKeyRef: { name: waba-catalog-db, key: ICEBERG_DB_PASSWORD } }
            - { name: AWS_REGION, value: "{{ .Values.region }}" }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: waba-s3, key: LAKEHOUSE_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: waba-s3, key: LAKEHOUSE_SECRET_KEY } }
          ports:
            - { name: http, containerPort: 8181 }
          readinessProbe:
            httpGet: { path: /v1/config, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/config, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: {{ .Values.resources.requests.cpu }}, memory: {{ .Values.resources.requests.memory }} }
            limits: { memory: {{ .Values.resources.limits.memory }} }
