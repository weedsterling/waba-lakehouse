apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  labels: { app.kubernetes.io/name: iceberg-rest, app.kubernetes.io/part-of: waba }
spec:
  replicas: 1
  strategy: { type: Recreate }            # volume RWO + SQLite : jamais deux instances en parallèle
  selector:
    matchLabels: { app.kubernetes.io/name: iceberg-rest }
  template:
    metadata:
      labels: { app.kubernetes.io/name: iceberg-rest, app.kubernetes.io/part-of: waba }
    spec:
      initContainers:
        - name: volume-permissions        # l'image tourne en utilisateur non root
          image: busybox:1.36
          command: ["sh", "-c", "chmod 0777 /data"]
          volumeMounts:
            - { name: catalog, mountPath: /data }
      containers:
        - name: iceberg-rest
          image: {{ .Values.image }}
          env:
            - { name: CATALOG_WAREHOUSE, value: "{{ .Values.warehouse }}" }
            - { name: CATALOG_IO__IMPL, value: org.apache.iceberg.aws.s3.S3FileIO }
            - { name: CATALOG_S3_ENDPOINT, value: "{{ .Values.s3Endpoint }}" }
            - { name: CATALOG_S3_PATH__STYLE__ACCESS, value: "true" }
            - { name: CATALOG_URI, value: "jdbc:sqlite:file:/home/iceberg/data/iceberg_catalog.db" }
            - { name: AWS_REGION, value: "{{ .Values.region }}" }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: waba-s3, key: LAKEHOUSE_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: waba-s3, key: LAKEHOUSE_SECRET_KEY } }
          ports:
            - { name: http, containerPort: 8181 }
          readinessProbe:
            httpGet: { path: /v1/config, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/config, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: {{ .Values.resources.requests.cpu }}, memory: {{ .Values.resources.requests.memory }} }
            limits: { memory: {{ .Values.resources.limits.memory }} }
          volumeMounts:
            - { name: catalog, mountPath: /home/iceberg/data }
      volumes:
        - name: catalog
          persistentVolumeClaim: { claimName: iceberg-catalog }
