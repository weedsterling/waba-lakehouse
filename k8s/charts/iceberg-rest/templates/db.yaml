# Base PostgreSQL du catalogue Iceberg (métadonnées : namespaces, tables, pointeur de métadonnées courant).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iceberg-catalog-db
  labels: { app.kubernetes.io/name: iceberg-catalog-db, app.kubernetes.io/part-of: waba }
spec:
  serviceName: iceberg-catalog-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: iceberg-catalog-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: iceberg-catalog-db, app.kubernetes.io/part-of: waba }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.db.name | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.db.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: waba-catalog-db, key: ICEBERG_DB_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U {{ .Values.db.user }} -d {{ .Values.db.name }}"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U {{ .Values.db.user }} -d {{ .Values.db.name }}"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: {{ .Values.db.resources.requests.cpu }}, memory: {{ .Values.db.resources.requests.memory }} }
            limits: { memory: {{ .Values.db.resources.limits.memory }} }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.db.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-catalog-db
spec:
  selector: { app.kubernetes.io/name: iceberg-catalog-db }
  ports:
    - { name: pg, port: 5432, targetPort: pg }
