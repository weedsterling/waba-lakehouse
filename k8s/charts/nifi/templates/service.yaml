# Service « headless » : le pod est joignable sous nifi-0.nifi.<ns>.svc.cluster.local, nom identique à
# celui du certificat TLS autosigné de NiFi (pas d'erreur SNI / Host lors du provisionnement).
apiVersion: v1
kind: Service
metadata:
  name: nifi
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: nifi }
  ports:
    - { name: https, port: 8443, targetPort: https }
