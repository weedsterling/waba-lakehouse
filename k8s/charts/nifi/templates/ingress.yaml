# NiFi n'écoute qu'en HTTPS (certificat autosigné) : l'Ingress relaie en HTTPS vers le pod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nifi
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nifi
                port: { name: https }
