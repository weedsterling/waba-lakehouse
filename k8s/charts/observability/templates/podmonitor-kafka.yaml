# Métriques du Kafka Exporter (Strimzi) : kafka_consumergroup_lag, offsets et débit par topic.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-exporter
  labels: { app.kubernetes.io/part-of: waba }
spec:
  namespaceSelector:
    matchNames: [{{ .Values.kafka.namespace }}]
  selector:
    matchLabels:
      strimzi.io/name: {{ .Values.kafka.exporterName }}
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s
