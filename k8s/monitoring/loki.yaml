# =============================================================================
# 9.7 Observabilité — Loki monolithique (un seul pod, stockage sur volume, rétention 7 jours).
# Journaux collectés par Grafana Alloy (k8s/monitoring/alloy.yaml), interrogés depuis Grafana (datasource « Loki »).
# Mono-locataire (auth_enabled: false) : Loki n'est joignable que dans le cluster (Service ClusterIP, sans Ingress).
# =============================================================================
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 168h        # 7 jours, aligné sur la rétention des topics raw/silver
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    max_query_series: 2000
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  sidecar: false                  # pas de règles Loki (les alertes sont dans Grafana)
  persistence:
    enabled: true
    size: 4Gi
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 768Mi }
  extraEnv:
    - { name: GOMEMLIMIT, value: 600MiB }   # le ramasse-miettes Go reste sous la limite du conteneur

# Mode monolithique : aucun composant distribué, pas de passerelle ni de caches memcached (plusieurs Go)
write: { replicas: 0 }
read: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
