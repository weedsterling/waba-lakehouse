# WABA Group — Levels 1-2 : Lakehouse batch (MinIO, Iceberg, Spark, Trino) + orchestration Airflow
# Un seul `docker compose up -d --build` démarre toute la stack :
#   MinIO (+ init buckets / compte de service) · Iceberg REST catalog · Spark (master + worker)
#   · Trino · Streamlit
# Aucun secret en dur : toutes les valeurs viennent du fichier .env (cf. .env.example).

name: waba-lakehouse

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${LAKEHOUSE_ACCESS_KEY:?définir LAKEHOUSE_ACCESS_KEY dans .env}
  AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_SECRET_KEY:?définir LAKEHOUSE_SECRET_KEY dans .env}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  MINIO_ENDPOINT: http://minio:9000

x-airflow-env: &airflow-env
  <<: *s3-env
  PII_HASH_SALT: ${PII_HASH_SALT}
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?définir AIRFLOW_FERNET_KEY dans .env}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/passwords.json
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?définir AIRFLOW_JWT_SECRET dans .env}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?définir AIRFLOW_API_SECRET_KEY dans .env}
  AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  # Connections Airflow injectées depuis .env : aucun credential dans le code des DAGs
  AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
  AIRFLOW_CONN_MINIO_S3: '{"conn_type": "aws", "login": "${LAKEHOUSE_ACCESS_KEY}", "password": "${LAKEHOUSE_SECRET_KEY}", "extra": {"endpoint_url": "http://minio:9000", "region_name": "${AWS_REGION:-us-east-1}"}}'

x-airflow-common: &airflow-common
  image: waba/airflow:3.3.2-spark3.5.3
  pull_policy: never                      # construite par le service airflow-init
  user: "50000:0"
  environment:
    <<: *airflow-env
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./spark/jobs:/opt/waba/jobs:ro
    - ./spark/waba_spark:/opt/waba/waba_spark:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-config:/opt/airflow/config
  depends_on:
    airflow-init: { condition: service_completed_successfully }
    spark-master: { condition: service_started }
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ Storage
  minio:
    # MinIO a cessé de publier ses images communautaires (Docker Hub puis quay.io).
    # On utilise un build communautaire open source de la même release, épinglé.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?définir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?définir MINIO_ROOT_PASSWORD dans .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    restart: unless-stopped

  minio-init:
    # Crée les buckets et un compte de service dédié (principe du moindre privilège :
    # les applications n'utilisent jamais le compte root MinIO).
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3   # client mc figé (Bitnami legacy)
    user: root
    depends_on:
      minio: { condition: service_started }   # minio-init attend lui-même que MinIO réponde
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKEHOUSE_ACCESS_KEY: ${LAKEHOUSE_ACCESS_KEY}
      LAKEHOUSE_SECRET_KEY: ${LAKEHOUSE_SECRET_KEY}
      HOME: /tmp                    # mc écrit sa configuration dans $HOME/.mc
    volumes: [./scripts/minio-init.sh:/minio-init.sh:ro]
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"

  # ------------------------------------------------------------------ Catalog
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # Persistance du catalogue (SQLite sur volume) : survit aux redémarrages
      CATALOG_URI: jdbc:sqlite:file:/home/iceberg/iceberg_catalog.db
    ports: ["8181:8181"]
    volumes: [iceberg-catalog:/home/iceberg]
    restart: unless-stopped

  # ------------------------------------------------------------------ Compute
  spark-master:
    build: ./spark
    image: waba/spark:3.5.3-iceberg1.6.1
    pull_policy: build              # image locale : ne jamais la chercher sur un registre
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    depends_on: [iceberg-rest]
    environment:
      <<: *s3-env
      PII_HASH_SALT: ${PII_HASH_SALT:?définir PII_HASH_SALT dans .env}
      SPARK_NO_DAEMONIZE: "true"
    ports: ["8080:8080", "7077:7077", "4040:4040"]
    volumes:
      - ./spark/jobs:/opt/waba/jobs:ro          # hot-reload du code en développement
      - ./spark/waba_spark:/opt/waba/waba_spark:ro
    restart: unless-stopped

  spark-worker:
    image: waba/spark:3.5.3-iceberg1.6.1   # image construite par le service spark-master
    pull_policy: never
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      <<: *s3-env
      PII_HASH_SALT: ${PII_HASH_SALT}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-6}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-9g}
      SPARK_NO_DAEMONIZE: "true"
    ports: ["8081:8081"]
    restart: unless-stopped

  # ------------------------------------------------------------------ Serving
  trino:
    image: trinodb/trino:467
    deploy:
      resources:
        limits: { memory: 3g }            # la JVM Trino dimensionne son heap sur cette limite
    depends_on: [iceberg-rest]
    environment:
      <<: *s3-env
    ports: ["8088:8080"]
    volumes: [./trino/catalog:/etc/trino/catalog:ro]
    restart: unless-stopped

  # ------------------------------------------------------------------ Data generation
  generator:
    build: ./generator
    image: waba/generator:1.0
    pull_policy: build
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *s3-env
      RAW_BUCKET: raw-landing
      GENERATOR_CACHE_DIR: /data/referentials
    ports: ["8501:8501"]
    volumes: [generator-cache:/data]
    restart: unless-stopped

  # ================================================================== LEVEL 2 : orchestration
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?définir AIRFLOW_DB_PASSWORD dans .env}
      POSTGRES_DB: airflow
    volumes: [airflow-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    build:
      context: .                          # racine : l'image réutilise spark/jars et spark/conf
      dockerfile: airflow/Dockerfile
    pull_policy: build
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        mkdir -p /opt/airflow/logs /opt/airflow/config
        # Mot de passe de l'UI (SimpleAuthManager, remplacé par Keycloak au Level 4)
        printf '{"admin": "%s"}' "$${AIRFLOW_ADMIN_PASSWORD}" > /opt/airflow/config/passwords.json
        chown -R 50000:0 /opt/airflow/logs /opt/airflow/config
        chmod 600 /opt/airflow/config/passwords.json
        su airflow -s /bin/bash -c "PATH=$$PATH airflow db migrate"   # su réinitialise PATH : on le transmet
        su airflow -s /bin/bash -c "PATH=$$PATH airflow pools set spark 1 'Un seul job Spark a la fois'"
        echo "Airflow initialisé"
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?définir AIRFLOW_ADMIN_PASSWORD dans .env}
    depends_on:
      airflow-postgres: { condition: service_healthy }
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8090:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler           # joignable par les executors Spark (driver en mode client)
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

  # ================================================================== LEVEL 3 : speed layer
  kafka:
    # KRaft (sans Zookeeper) : un seul nœud broker + contrôleur, suffisant pour la démonstration.
    image: apache/kafka:3.8.1
    hostname: kafka
    environment:
      CLUSTER_ID: lDmh9mBjRdGFrcF5HQXymg     # UUID base64 (22 car.), fixe : le volume reste valide
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics déclarés explicitement (kafka-init)
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
    ports: ["9094:9094"]                  # accès depuis la VM (kcat, scripts de test)
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka: { condition: service_healthy }
    volumes: [./scripts/kafka-init.sh:/kafka-init.sh:ro]
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.1.0   # fork maintenu de provectus/kafka-ui
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: waba
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xmx256m
    ports: ["8085:8080"]
    restart: unless-stopped

  nifi:
    image: apache/nifi:1.28.1
    hostname: nifi
    depends_on:
      kafka: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_ADMIN_USER:-admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_ADMIN_PASSWORD:?définir NIFI_ADMIN_PASSWORD (12 caractères min.) dans .env}
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY:?définir NIFI_SENSITIVE_PROPS_KEY dans .env}
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
      NIFI_WEB_PROXY_HOST: localhost:8443,127.0.0.1:8443,${VM_HOST_IP:-192.168.127.128}:8443
    ports: ["8443:8443"]
    volumes:                              # état de ListS3 et files d'attente conservés au redémarrage
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-db:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
    restart: unless-stopped

  nifi-init:
    # Flow-as-code : construit le flux MinIO -> Kafka via l'API REST NiFi (idempotent)
    image: python:3.12-slim
    depends_on:
      nifi: { condition: service_started }
      kafka-init: { condition: service_completed_successfully }
    environment:
      NIFI_ADMIN_USER: ${NIFI_ADMIN_USER:-admin}
      NIFI_ADMIN_PASSWORD: ${NIFI_ADMIN_PASSWORD}
      LAKEHOUSE_ACCESS_KEY: ${LAKEHOUSE_ACCESS_KEY}
      LAKEHOUSE_SECRET_KEY: ${LAKEHOUSE_SECRET_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes: [./nifi/provision_flow.py:/provision_flow.py:ro]
    command: ["python", "-u", "/provision_flow.py"]
    restart: "no"

  stream-raw-silver:
    # Job 1 du speed layer : processus permanent (pas une tâche Airflow) relancé automatiquement ;
    # reprise exacte depuis le checkpoint MinIO. Au Level 4 : SparkApplication (Spark Operator).
    image: waba/spark:3.5.3-iceberg1.6.1
    pull_policy: never
    hostname: stream-raw-silver           # joignable par les executors (driver en mode client)
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      spark-master: { condition: service_started }
    environment:
      <<: *s3-env
      PII_HASH_SALT: ${PII_HASH_SALT}
      PYTHONPATH: /opt/waba
      KAFKA_BOOTSTRAP: kafka:9092
    command:
      - /opt/spark/bin/spark-submit
      - --conf
      - spark.driver.host=stream-raw-silver
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - --conf
      - spark.driver.memory=768m
      - --conf
      - spark.cores.max=1                 # 1 cœur réservé en permanence : le batch garde les siens
      - --conf
      - spark.executor.cores=1
      - --conf
      - spark.executor.memory=1g
      - --conf
      - spark.sql.shuffle.partitions=4    # état de dédoublonnage : 4 partitions (figé par le checkpoint)
      - /opt/waba/jobs/stream_raw_to_silver.py
    volumes:
      - ./spark/jobs:/opt/waba/jobs:ro
      - ./spark/waba_spark:/opt/waba/waba_spark:ro
    restart: unless-stopped

volumes:
  minio-data:
  iceberg-catalog:
  generator-cache:
  airflow-db:
  airflow-logs:
  airflow-config:
  kafka-data:
  nifi-conf:
  nifi-state:
  nifi-db:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
